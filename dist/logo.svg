<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="neonRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e93" />
      <stop offset="50%" stop-color="#9B00E8" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <linearGradient id="vaultGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="50%" stop-color="#ffb800" />
      <stop offset="100%" stop-color="#ff8800" />
    </linearGradient>
    <radialGradient id="obsidianCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141830" />
      <stop offset="75%" stop-color="#090a16" />
      <stop offset="100%" stop-color="#060710" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Obsidian Medallion -->
  <circle cx="50" cy="50" r="48" fill="url(#obsidianCore)" stroke="url(#neonRim)" stroke-width="2.5" />

  <!-- Outer Vault Gear / Dial Notches -->
  <circle cx="50" cy="50" r="43" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1" stroke-dasharray="2,4" />
  
  <!-- Circuit Crosshairs -->
  <line x1="50" y1="8" x2="50" y2="16" stroke="#00f0ff" stroke-width="1.5" />
  <line x1="50" y1="84" x2="50" y2="92" stroke="#00f0ff" stroke-width="1.5" />
  <line x1="8" y1="50" x2="16" y2="50" stroke="#ff2e93" stroke-width="1.5" />
  <line x1="84" y1="50" x2="92" y2="50" stroke="#ff2e93" stroke-width="1.5" />

  <!-- Inner Neon Ring -->
  <circle cx="50" cy="50" r="34" stroke="rgba(255, 46, 147, 0.4)" stroke-width="1.5" />

  <!-- Stylized Retro Miami Palm in Vault Center -->
  <path d="M50 70 Q49 54 48 44 Q42 42 34 44 Q40 48 46 49 Q48 57 49 70 Z" fill="url(#vaultGold)" />
  <path d="M50 70 Q51 54 52 44 Q58 42 66 44 Q60 48 54 49 Q52 57 51 70 Z" fill="url(#vaultGold)" />
  <path d="M49 44 Q38 34 28 36 Q38 39 46 42 Z" fill="url(#vaultGold)" />
  <path d="M51 44 Q62 34 72 36 Q62 39 54 42 Z" fill="url(#vaultGold)" />
  <path d="M50 44 Q49 30 44 24 Q48 31 49 43 Z" fill="url(#neonRim)" />
  <path d="M50 44 Q51 30 56 24 Q52 31 51 43 Z" fill="url(#neonRim)" />

  <!-- Central $HEIST 'H' Geometric Vault Monogram -->
  <!-- Left Pillar -->
  <polygon points="36,28 41,28 41,72 36,72" fill="#ffffff" filter="url(#neonGlow)" />
  <!-- Right Pillar -->
  <polygon points="59,28 64,28 64,72 59,72" fill="#ffffff" filter="url(#neonGlow)" />
  <!-- Crossbar with Gold Vault Lock Keyhole -->
  <polygon points="41,47 59,47 59,53 41,53" fill="url(#vaultGold)" />
  <circle cx="50" cy="50" r="4.5" fill="#060710" stroke="#ff2e93" stroke-width="1.5" />
  <rect x="49" y="50" width="2" height="3.5" fill="#00f0ff" />

  <!-- Diagonal Cyan Laser Accent -->
  <line x1="26" y1="74" x2="74" y2="26" stroke="#00f0ff" stroke-width="1.2" stroke-linecap="round" opacity="0.6" filter="url(#neonGlow)" />

  <!-- Gold Star Emblems -->
  <polygon points="50,18 51.5,21.5 55,22 52.5,24.5 53,28 50,26 47,28 47.5,24.5 45,22 48.5,21.5" fill="url(#vaultGold)" />
</svg>
